name: Weekly pomodoro email

on:
  schedule:
    # ~5:37 AM Saturday in America/Mexico_City. Off-peak minute on purpose:
    # GitHub silently drops top-of-hour crons under load (it ate 0 12 on 2026-08-29).
    - cron: "37 11 * * 6"
  workflow_dispatch:

jobs:
  send:
    name: Send weekly pomodoro report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: weekly-pomodoro-email
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Send weekly pomodoro report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
        run: python3 scripts/weekly_email.py

      # Heartbeat for healthchecks.io. Success says "I ran"; failure pings
      # /fail with a link to the run, so the alert carries the same context
      # GitHub's own failure email does -- that email is what this replaces.
      - name: Heartbeat
        if: success()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL" || true

      - name: Heartbeat (failure)
        if: failure()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          curl -fsS -m 10 --retry 3 \
            --data-raw "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$HC_PING_URL/fail" || true
