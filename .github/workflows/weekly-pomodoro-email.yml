name: Weekly pomodoro email

on:
  schedule:
    # 6:00 AM Saturday in America/Mexico_City (UTC-6).
    - cron: "0 12 * * 6"
  workflow_dispatch:

jobs:
  send:
    name: Send weekly pomodoro report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: weekly-pomodoro-email
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth

      - name: Send weekly pomodoro report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
        run: python3 scripts/weekly_email.py
