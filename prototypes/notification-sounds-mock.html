<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification sound options</title>
<style>
  :root { --bg:#09090b; --card:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; padding:40px 24px 80px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  .opt { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; display:flex; align-items:center; gap:18px; }
  .opt button { min-width:96px; min-height:44px; border:0; border-radius:8px; background:var(--text); color:#18181b; font:inherit; font-weight:600; cursor:pointer; }
  .opt button:hover { background:#e4e4e7; }
  .opt h2 { font-size:15px; margin:0 0 2px; }
  .opt p { color:var(--muted); font-size:13px; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Notification sounds — pick one</h1>
  <div class="sub">Click Play on each. The same sound would fire on every notification: session done, break over, idle nudge.</div>
  <div id="list"></div>
</div>

<script>
let ctx;
function ac() { ctx = ctx || new AudioContext(); if (ctx.state === "suspended") ctx.resume(); return ctx; }

function tone(freq, at, dur, peak, type = "triangle", withHarmonic = true) {
  const c = ac(), t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
  if (withHarmonic) {
    const h = c.createOscillator(), hg = c.createGain();
    h.type = "sine"; h.frequency.setValueAtTime(freq * 2, t);
    hg.gain.setValueAtTime(0.0001, t);
    hg.gain.exponentialRampToValueAtTime(peak * 0.25, t + 0.025);
    hg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    h.connect(hg); hg.connect(c.destination);
    h.start(t); h.stop(t + dur + 0.02);
  }
}

const SOUNDS = [
  { key: "current", name: "1 — Current double ding", desc: "What the app plays today when a session completes. G5 then C6, bright and quick.",
    play: () => { tone(784, 0, 0.28, 0.32); tone(1046, 0.32, 0.28, 0.32); } },
  { key: "marimba", name: "2 — Marimba rise", desc: "Three warm rising notes (C-E-G), soft mallet feel. Friendly, not urgent.",
    play: () => { tone(523, 0, 0.35, 0.26, "sine"); tone(659, 0.14, 0.35, 0.26, "sine"); tone(784, 0.28, 0.5, 0.28, "sine"); } },
  { key: "bell", name: "3 — Single bell", desc: "One long bell strike with a slow fade. Calm, meditation-timer vibe.",
    play: () => { tone(880, 0, 1.6, 0.3, "sine"); tone(2200, 0, 0.9, 0.06, "sine", false); tone(1320, 0, 1.2, 0.08, "sine", false); } },
  { key: "blip", name: "4 — Soft blip", desc: "A single quick low-key pop. The most discreet option.",
    play: () => { const c = ac(), t = c.currentTime; const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(440, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.3); } },
  { key: "tritone", name: "5 — Tri-tone chime", desc: "Three-note descending chime (like a phone alert), rounded and clear.",
    play: () => { tone(1046, 0, 0.4, 0.26, "sine"); tone(880, 0.18, 0.4, 0.26, "sine"); tone(698, 0.36, 0.6, 0.28, "sine"); } },
];

const list = document.getElementById("list");
for (const s of SOUNDS) {
  const div = document.createElement("div");
  div.className = "opt";
  div.innerHTML = `<button>Play</button><div><h2>${s.name}</h2><p>${s.desc}</p></div>`;
  div.querySelector("button").addEventListener("click", s.play);
  list.appendChild(div);
}
</script>
</body>
</html>
