<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glass drift — 6 variants</title>
<style>
  :root { --bg:#09090b; --card:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; padding:40px 24px 80px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  .opt { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; display:flex; align-items:center; gap:18px; }
  .opt.ref { border-style: dashed; }
  .opt button { min-width:96px; min-height:44px; border:0; border-radius:8px; background:var(--text); color:#18181b; font:inherit; font-weight:600; cursor:pointer; }
  .opt button:hover { background:#e4e4e7; }
  .opt h2 { font-size:15px; margin:0 0 2px; }
  .opt p { color:var(--muted); font-size:13px; margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Glass drift, six ways</h1>
  <div class="sub">The original for reference, then six variations on the same high, quiet shimmer.</div>
  <div id="list"></div>
</div>

<script>
let ctx;
function ac() { ctx = ctx || new AudioContext(); if (ctx.state === "suspended") ctx.resume(); return ctx; }

function voice(freq, at, dur, peak, attack, cutoff = 4000) {
  const c = ac(), t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = "sine"; o.frequency.setValueAtTime(freq, t);
  f.type = "lowpass"; f.frequency.setValueAtTime(cutoff, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

function breath(at, dur, peak, freq, q = 1.2) {
  const c = ac(), t = c.currentTime + at;
  const len = Math.ceil(c.sampleRate * (dur + 0.1));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.setValueAtTime(q, t);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t); src.stop(t + dur + 0.05);
}

const SOUNDS = [
  { ref: true, name: "Original — Glass drift", desc: "Three shimmer tones entering one after another.",
    play: () => { voice(1318.5, 0, 1.8, 0.06, 0.4); voice(1567.9, 0.35, 1.8, 0.05, 0.4); voice(1975.5, 0.7, 2.0, 0.04, 0.4); } },
  { name: "A — Glass rise", desc: "Four tones climbing higher, a longer upward drift.",
    play: () => { voice(1046.5, 0, 1.6, 0.06, 0.35); voice(1318.5, 0.3, 1.6, 0.055, 0.35); voice(1567.9, 0.6, 1.7, 0.05, 0.35); voice(2093, 0.9, 2.0, 0.04, 0.4); } },
  { name: "B — Glass fall", desc: "The same drift but descending — settles instead of lifts.",
    play: () => { voice(1975.5, 0, 1.6, 0.045, 0.35); voice(1567.9, 0.35, 1.7, 0.05, 0.35); voice(1318.5, 0.7, 2.0, 0.06, 0.4); } },
  { name: "C — Glass pair", desc: "Just two tones, sparser and quieter. Most minimal.",
    play: () => { voice(1318.5, 0, 2.0, 0.055, 0.45); voice(1760, 0.5, 2.2, 0.045, 0.5); } },
  { name: "D — Crystal rain", desc: "Five tiny sparkles scattered like drops.",
    play: () => { voice(1567.9, 0, 0.9, 0.05, 0.15); voice(2093, 0.22, 0.9, 0.04, 0.15); voice(1760, 0.42, 0.9, 0.045, 0.15); voice(2637, 0.6, 1.0, 0.03, 0.15); voice(1975.5, 0.85, 1.3, 0.04, 0.2); } },
  { name: "E — Glass swell", desc: "The three tones together as one chord, one slow breath.",
    play: () => { voice(1318.5, 0, 2.2, 0.05, 0.8); voice(1567.9, 0, 2.2, 0.045, 0.9); voice(1975.5, 0, 2.2, 0.035, 1.0); } },
  { name: "F — Frosted", desc: "Glass drift over a faint whisper of air underneath.",
    play: () => { breath(0, 2.2, 0.06, 3000, 2); voice(1318.5, 0.1, 1.8, 0.055, 0.4); voice(1567.9, 0.45, 1.8, 0.05, 0.4); voice(1975.5, 0.8, 2.0, 0.04, 0.4); } },
];

const list = document.getElementById("list");
for (const s of SOUNDS) {
  const div = document.createElement("div");
  div.className = "opt" + (s.ref ? " ref" : "");
  div.innerHTML = `<button>Play</button><div><h2>${s.name}</h2><p>${s.desc}</p></div>`;
  div.querySelector("button").addEventListener("click", s.play);
  list.appendChild(div);
}
</script>
</body>
</html>
