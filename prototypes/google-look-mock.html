<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Sessions — Google style</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f1f1f;
      --ink-2: #444746;
      --muted: #5f6368;
      --line: #e3e3e3;
      --chip: #f1f3f4;
      --hover: rgba(31, 31, 31, 0.08);
      --bg: #fff;
      font-family: "Google Sans Flex", Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      position: relative;
      display: grid;
      gap: 28px;
      width: min(720px, calc(100vw - 28px));
      padding: 44px 30px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--bg);
    }

    /* ---- timer ---- */

    .timer {
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 8px 0 0;
    }

    .state {
      min-height: 21px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(74px, 22vw, 104px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    /* ---- actions ---- */

    .actions { display: grid; gap: 12px; justify-items: center; }

    button {
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 999px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.42; }

    .primary {
      width: 100%;
      min-height: 54px;
      border: 0;
      background: var(--ink);
      color: #fff;
    }

    .primary:hover { background: #000; }

    .secondary {
      min-height: 40px;
      padding: 0 22px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink-2);
    }

    .secondary:hover:not(:disabled) { background: var(--hover); }

    /* ---- week pace ---- */

    .week-pace { display: grid; gap: 11px; }

    .pace-row {
      display: grid;
      grid-template-columns: 78px 1fr 84px;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .pace-group-end { margin-bottom: 8px; }

    .pace-bar {
      height: 8px;
      border-radius: 999px;
      background: var(--chip);
      overflow: hidden;
    }

    .pace-fill { height: 100%; border-radius: 999px; background: var(--ink); }
    .pace-fill.past { background: #b8b8b8; }

    .pace-count { text-align: right; color: var(--ink-2); white-space: nowrap; }
    .pace-count.past { color: var(--muted); }

    /* ---- heatmap ---- */

    .heatmap { display: grid; gap: 6px; }

    .day-grid {
      display: grid;
      grid-template-columns: 34px repeat(24, 1fr);
      gap: 3px;
      align-items: center;
    }

    .day-grid .day-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--chip);
      font-size: 9px;
      font-weight: 500;
      display: grid;
      place-items: center;
      color: transparent;
    }

    .cell.l1 { background: #dadce0; color: var(--ink-2); }
    .cell.l2 { background: #9aa0a6; color: #fff; }
    .cell.l3 { background: #3c4043; color: #fff; }

    .hour-labels {
      display: grid;
      grid-template-columns: 34px repeat(24, 1fr);
      gap: 3px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
    }

    .hour-labels .label-12a { grid-column: 2; }
    .hour-labels .label-6a { grid-column: 8; }
    .hour-labels .label-12p { grid-column: 14; }
    .hour-labels .label-6p { grid-column: 20; }

    /* ---- sync status ---- */

    .sync-status {
      position: absolute;
      top: 16px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 13px;
    }

    .sync-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa0a6;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Focus session timer">
    <section class="timer">
      <div class="state">3 sessions today</div>
      <div class="time">30:00</div>
    </section>

    <section class="actions">
      <button class="primary" type="button">Start</button>
      <div class="small-actions">
        <button class="secondary" type="button">Undo</button>
      </div>
    </section>

    <section class="week-pace" aria-label="Today and this week versus the same point before">
      <div class="pace-row">
        <div class="pace-label">Today</div>
        <div class="pace-bar"><div class="pace-fill" style="width:60%"></div></div>
        <div class="pace-count">3 sessions</div>
      </div>
      <div class="pace-row pace-group-end">
        <div class="pace-label" title="Yesterday, by this time of day">Yesterday</div>
        <div class="pace-bar"><div class="pace-fill past" style="width:40%"></div></div>
        <div class="pace-count past">2 sessions</div>
      </div>
      <div class="pace-row">
        <div class="pace-label">Week</div>
        <div class="pace-bar"><div class="pace-fill" style="width:76%"></div></div>
        <div class="pace-count">19 sessions</div>
      </div>
      <div class="pace-row">
        <div class="pace-label" title="Last week, by this point of the week">Last week</div>
        <div class="pace-bar"><div class="pace-fill past" style="width:64%"></div></div>
        <div class="pace-count past">16 sessions</div>
      </div>
    </section>

    <section class="heatmap" aria-label="Focus sessions by hour">
      <h2 class="visually-hidden">Global history by weekday and hour</h2>
      <div class="day-grid" id="hourGrid"></div>
      <div class="hour-labels" aria-hidden="true">
        <span></span>
        <span class="label-12a">12a</span>
        <span class="label-6a">6a</span>
        <span class="label-12p">12p</span>
        <span class="label-6p">6p</span>
      </div>
    </section>

    <div class="sync-status">Local only</div>
  </main>

  <script>
    const grid = document.getElementById("hourGrid");
    const days = ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"];
    const seed = [0,0,0,0,0,0,0,1,2,3,3,2,1,1,2,3,2,1,1,1,0,0,0,0];
    days.forEach((day, dayIndex) => {
      const label = document.createElement("div");
      label.className = "day-label";
      label.textContent = day;
      grid.appendChild(label);
      for (let hour = 0; hour < 24; hour += 1) {
        const cell = document.createElement("div");
        const level = Math.max(0, seed[hour] - ((dayIndex * 5 + hour) % 3));
        cell.className = level > 0 ? `cell l${level}` : "cell";
        if (level > 0) cell.textContent = level;
        grid.appendChild(cell);
      }
    });
  </script>
</body>
</html>
