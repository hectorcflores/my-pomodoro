<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>&#8203;</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #fff;
      --ink: #000;
      --muted: #555;
      --line: #000;
      --surface: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .app {
      position: relative;
      display: grid;
      gap: 24px;
      width: min(720px, calc(100vw - 28px));
      padding: 38px 26px 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .timer {
      display: grid;
      gap: 12px;
      justify-items: center;
      padding: 10px 0 2px;
    }

    .state {
      min-height: 21px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(74px, 22vw, 104px);
      font-weight: 850;
      line-height: 0.92;
      letter-spacing: 0;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .primary {
      background: #000;
      color: #fff;
    }

    .primary:hover {
      background: #222;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .secondary:hover {
      background: #f2f2f2;
    }

    .small-actions {
      display: grid;
    }

    .small-actions button {
      min-height: 44px;
      color: var(--muted);
      font-size: 14px;
    }

    .sync-status {
      position: absolute;
      top: 12px;
      right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .sync-status::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #c40000;
    }

    .sync-status[data-status="synced"]::before,
    .sync-status[data-status="syncing"]::before {
      background: #008000;
    }

    .sync-status[data-status="syncing"]::before {
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    .week-pace {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .pace-row {
      display: grid;
      grid-template-columns: 64px 1fr 86px;
      gap: 10px;
      align-items: center;
    }

    .pace-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
    }

    .pace-bar {
      height: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .pace-fill {
      height: 100%;
      width: 0;
      background: #000;
    }

    .pace-fill.past {
      background: #a6a6a6;
    }

    .pace-count {
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .pace-count.past {
      color: var(--muted);
    }

    .pace-group-end {
      margin-bottom: 8px;
    }

    .heatmap {
      display: grid;
      gap: 10px;
      padding-top: 2px;
    }

    .day-grid {
      display: grid;
      grid-template-columns: 48px repeat(24, minmax(0, 1fr));
      gap: 4px;
      align-items: center;
    }

    .day-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hour {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #000;
      background: #fff;
      font-size: 9px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #000;
    }

    .hour.level-3,
    .hour.level-4 {
      color: #fff;
    }

    .hour.level-1 {
      background: #d9d9d9;
    }

    .hour.level-2 {
      background: #a6a6a6;
    }

    .hour.level-3 {
      background: #595959;
    }

    .hour.level-4 {
      background: #000;
    }

    .hour-labels {
      display: grid;
      grid-template-columns: 48px repeat(24, minmax(0, 1fr));
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .hour-labels span {
      text-align: center;
    }

    .hour-labels .label-12a {
      grid-column: 2;
    }

    .hour-labels .label-6a {
      grid-column: 8;
    }

    .hour-labels .label-12p {
      grid-column: 14;
    }

    .hour-labels .label-6p {
      grid-column: 20;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Focus session timer">
    <section class="timer">
      <div class="state" id="state">0 sessions today</div>
      <div class="time" id="time">30:00</div>
    </section>

    <section class="actions">
      <button class="primary" id="mainButton" type="button">Start</button>
      <div class="small-actions">
        <button class="secondary" id="undoButton" type="button">Undo</button>
      </div>
    </section>

    <section class="week-pace" aria-label="Today and this week versus the same point before">
      <div class="pace-row">
        <div class="pace-label">Today</div>
        <div class="pace-bar"><div class="pace-fill" id="todayFill"></div></div>
        <div class="pace-count" id="todayCount">0</div>
      </div>
      <div class="pace-row pace-group-end">
        <div class="pace-label" title="Yesterday, by this time of day">Yesterday</div>
        <div class="pace-bar"><div class="pace-fill past" id="yesterdayFill"></div></div>
        <div class="pace-count past" id="yesterdayCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label">Week</div>
        <div class="pace-bar"><div class="pace-fill" id="thisWeekFill"></div></div>
        <div class="pace-count" id="thisWeekCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label" title="Last week, by this point of the week">Last week</div>
        <div class="pace-bar"><div class="pace-fill past" id="lastWeekFill"></div></div>
        <div class="pace-count past" id="lastWeekCount">0</div>
      </div>
    </section>

    <section class="heatmap" aria-label="Focus sessions by hour">
      <h2 class="visually-hidden">Global history by weekday and hour</h2>
      <div class="day-grid" id="hourGrid"></div>
      <div class="hour-labels" aria-hidden="true">
        <span></span>
        <span class="label-12a">12a</span>
        <span class="label-6a">6a</span>
        <span class="label-12p">12p</span>
        <span class="label-6p">6p</span>
      </div>
    </section>

    <div class="sync-status" id="syncStatus" data-status="local">Local only</div>
  </main>

  <script>
    const storageKey = "focus-sessions.v1";
    const syncConfigStorageKey = "focus-sessions.sync-config.v1";
    const clientIdStorageKey = "focus-sessions.client-id.v1";
    const defaultSessionSeconds = 30 * 60;
    const idleNudgeAfterSeconds = 15 * 60;
    const idleNudgeMaxAgeSeconds = 90 * 60;
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const urlSeconds = Number(params.get("seconds"));
    const sessionSeconds = Number.isFinite(urlSeconds) && urlSeconds > 0 ? urlSeconds : defaultSessionSeconds;

    const els = {
      time: document.querySelector("#time"),
      state: document.querySelector("#state"),
      mainButton: document.querySelector("#mainButton"),
      undoButton: document.querySelector("#undoButton"),
      syncStatus: document.querySelector("#syncStatus"),
      hourGrid: document.querySelector("#hourGrid"),
      todayFill: document.querySelector("#todayFill"),
      todayCount: document.querySelector("#todayCount"),
      yesterdayFill: document.querySelector("#yesterdayFill"),
      yesterdayCount: document.querySelector("#yesterdayCount"),
      thisWeekFill: document.querySelector("#thisWeekFill"),
      thisWeekCount: document.querySelector("#thisWeekCount"),
      lastWeekFill: document.querySelector("#lastWeekFill"),
      lastWeekCount: document.querySelector("#lastWeekCount")
    };

    let state = loadState();
    let tick = null;
    let syncConfig = null;
    let audioContext = null;

    function todayKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function localStartOfTodayIso() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    }

    function loadState() {
      const fallback = {
        sessions: [],
        activeSession: null,
        completionPending: false,
        nudgedSessionId: null
      };

      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || "{}");
        const sessions = Array.isArray(stored.sessions) ? stored.sessions : [];
        return {
          sessions,
          activeSession: stored.activeSession || null,
          completionPending: Boolean(stored.completionPending)
            && sessions.some((session) => session.date === todayKey()),
          nudgedSessionId: stored.nudgedSessionId || null
        };
      } catch {
        return fallback;
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function setSyncStatus(label, status = "local") {
      els.syncStatus.textContent = label;
      els.syncStatus.dataset.status = status;
    }

    function loadSyncConfig() {
      try {
        return JSON.parse(localStorage.getItem(syncConfigStorageKey) || "null");
      } catch {
        return null;
      }
    }

    function saveSyncConfig(config) {
      localStorage.setItem(syncConfigStorageKey, JSON.stringify(config));
    }

    async function configureSyncFromUrl() {
      const supabaseUrl = hashParams.get("sb_url") || params.get("sb_url");
      const supabaseAnonKey = hashParams.get("sb_key") || params.get("sb_key");
      const syncKey = hashParams.get("sync_key") || params.get("sync_key");

      if (!supabaseUrl || !supabaseAnonKey || !syncKey) {
        return loadSyncConfig();
      }

      const config = {
        supabaseUrl: supabaseUrl.replace(/\/$/, ""),
        supabaseAnonKey,
        syncKeyHash: await sha256(syncKey)
      };

      saveSyncConfig(config);
      window.history.replaceState({}, document.title, `${window.location.pathname}${window.location.search}`);
      return config;
    }

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function createId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    }

    function clientId() {
      const existing = localStorage.getItem(clientIdStorageKey);
      if (existing) return existing;
      const next = createId();
      localStorage.setItem(clientIdStorageKey, next);
      return next;
    }

    function startSession() {
      state.activeSession = {
        id: createId(),
        startedAt: new Date().toISOString(),
        durationSeconds: sessionSeconds,
        pausedRemainingSeconds: null
      };
      state.completionPending = false;
      startTick();
      render();
      saveState();
    }

    function pauseSession() {
      if (!state.activeSession) return;
      state.activeSession.pausedRemainingSeconds = remainingSeconds();
      stopTick();
      render();
      saveState();
    }

    function resumeSession() {
      if (!state.activeSession) return;
      const remaining = state.activeSession.pausedRemainingSeconds || sessionSeconds;
      const elapsedSeconds = state.activeSession.durationSeconds - remaining;
      state.activeSession.startedAt = new Date(Date.now() - elapsedSeconds * 1000).toISOString();
      state.activeSession.pausedRemainingSeconds = null;
      startTick();
      render();
      saveState();
    }

    function handleMainAction() {
      prepareAlerts();

      if (!state.activeSession) {
        startSession();
        return;
      }

      if (state.activeSession.pausedRemainingSeconds !== null) {
        resumeSession();
      } else {
        pauseSession();
      }
    }

    function completeSession() {
      if (!state.activeSession) return;
      const now = new Date();
      const session = {
        id: state.activeSession.id,
        date: todayKey(now),
        startedAt: state.activeSession.startedAt,
        completedAt: now.toISOString(),
        durationSeconds: state.activeSession.durationSeconds,
        clientId: clientId()
      };
      state.sessions.push(session);
      state.activeSession = null;
      state.completionPending = true;
      stopTick();
      render();
      saveState();
      alertCompletion();
      createRemoteSession(session);
    }

    function undoLast() {
      const today = todayKey();
      const index = state.sessions.map((session) => session.date).lastIndexOf(today);
      if (index >= 0) {
        state.sessions.splice(index, 1);
        state.completionPending = false;
        render();
        saveState();
        undoRemoteSession();
      }
    }

    function remainingSeconds() {
      if (!state.activeSession) return sessionSeconds;
      if (state.activeSession.pausedRemainingSeconds !== null) {
        return state.activeSession.pausedRemainingSeconds;
      }

      const startedAt = new Date(state.activeSession.startedAt).getTime();
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      return Math.max(0, state.activeSession.durationSeconds - elapsed);
    }

    function settleExpiredSession() {
      if (!state.activeSession || state.activeSession.pausedRemainingSeconds !== null) return;
      if (remainingSeconds() === 0) {
        completeSession();
      }
    }

    function startTick() {
      stopTick();
      tick = setInterval(() => {
        settleExpiredSession();
        render();
        saveState();
      }, 1000);
    }

    function stopTick() {
      if (tick) {
        clearInterval(tick);
        tick = null;
      }
    }

    function sessionsToday() {
      return state.sessions.filter((session) => session.date === todayKey());
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function hourCounts(sessions) {
      const counts = Array.from({ length: 24 }, () => 0);
      sessions.forEach((session) => {
        counts[new Date(session.completedAt).getHours()] += 1;
      });
      return counts;
    }

    function render() {
      settleExpiredSession();
      const today = sessionsToday();
      const remaining = remainingSeconds();

      els.time.textContent = formatTime(remaining);
      els.state.textContent = sessionsLabel(today.length) + " today";
      els.mainButton.textContent = buttonLabel();
      els.undoButton.disabled = today.length === 0;
      renderWeekPace();
      renderHeatmap();
      updateTabTitle(remaining);
    }

    function buttonLabel() {
      if (!state.activeSession) return state.completionPending ? "Start next" : "Start";
      return state.activeSession.pausedRemainingSeconds !== null ? "Resume" : "Pause";
    }

    function updateTabTitle(remaining) {
      if (state.completionPending && !state.activeSession) {
        document.title = "Done";
        return;
      }

      document.title = state.activeSession && state.activeSession.pausedRemainingSeconds === null
        ? formatTime(remaining)
        : "\u200B";
    }

    function prepareAlerts() {
      prepareAudio();
      requestNotificationPermission();
    }

    function prepareAudio() {
      try {
        audioContext = audioContext || new AudioContext();
        if (audioContext.state === "suspended") {
          audioContext.resume();
        }
      } catch (error) {
        console.warn(error);
      }
    }

    function requestNotificationPermission() {
      if (!("Notification" in window) || Notification.permission !== "default") return;
      const permissionRequest = Notification.requestPermission();
      if (permissionRequest && typeof permissionRequest.catch === "function") {
        permissionRequest.catch((error) => console.warn(error));
      }
    }

    function alertCompletion() {
      playDoubleDing();
      showCompletionNotification();
    }

    function playDoubleDing() {
      try {
        prepareAudio();
        if (!audioContext) return;

        playTone(784, 0);
        playTone(1046, 0.32);
      } catch (error) {
        console.warn(error);
      }
    }

    function playTone(frequency, delay) {
      const start = audioContext.currentTime + delay;
      const duration = 0.28;
      const oscillator = audioContext.createOscillator();
      const harmonic = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const harmonicGain = audioContext.createGain();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, start);
      harmonic.type = "sine";
      harmonic.frequency.setValueAtTime(frequency * 2, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.32, start + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      harmonicGain.gain.setValueAtTime(0.0001, start);
      harmonicGain.gain.exponentialRampToValueAtTime(0.08, start + 0.025);
      harmonicGain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      oscillator.connect(gain);
      harmonic.connect(harmonicGain);
      gain.connect(audioContext.destination);
      harmonicGain.connect(audioContext.destination);
      oscillator.start(start);
      harmonic.start(start);
      oscillator.stop(start + duration + 0.02);
      harmonic.stop(start + duration + 0.02);
    }

    function showCompletionNotification() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;

      new Notification("Done", {
        body: "Focus session complete.",
        icon: "./favicon.svg"
      });
    }

    function maybeShowIdleNudge() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (state.activeSession) return;

      const last = sessionsToday().reduce((latest, session) => {
        if (!latest) return session;
        return session.completedAt > latest.completedAt ? session : latest;
      }, null);
      if (!last || last.id === state.nudgedSessionId) return;

      // Only nudge in the window where a forgotten restart is plausible.
      const idleSeconds = (Date.now() - new Date(last.completedAt).getTime()) / 1000;
      if (idleSeconds < idleNudgeAfterSeconds || idleSeconds > idleNudgeMaxAgeSeconds) return;

      state.nudgedSessionId = last.id;
      saveState();

      const notification = new Notification("Still working?", {
        body: "No session running. Start one so it counts.",
        icon: "./favicon.svg"
      });
      notification.onclick = () => {
        window.focus();
        notification.close();
      };
    }

    function sessionsLabel(count) {
      return `${count} ${count === 1 ? "session" : "sessions"}`;
    }

    function renderWeekPace() {
      // Weeks run Saturday 00:00 -> Friday 24:00, local time (same as the weekly email).
      const now = new Date();
      const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 1) % 7));
      const elapsed = now.getTime() - weekStart.getTime();
      const lastWeekStart = weekStart.getTime() - 7 * 86400 * 1000;

      const countBetween = (lo, hi) => state.sessions.filter((session) => {
        const at = new Date(session.completedAt).getTime();
        return at >= lo && at < hi;
      }).length;

      const thisWeek = countBetween(weekStart.getTime(), now.getTime());
      const lastWeek = countBetween(lastWeekStart, lastWeekStart + elapsed);
      const paceMax = Math.max(thisWeek, lastWeek, 1);

      els.thisWeekCount.textContent = sessionsLabel(thisWeek);
      els.lastWeekCount.textContent = sessionsLabel(lastWeek);
      els.thisWeekFill.style.width = `${(thisWeek / paceMax) * 100}%`;
      els.lastWeekFill.style.width = `${(lastWeek / paceMax) * 100}%`;

      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const dayElapsed = now.getTime() - todayStart;
      const yesterdayStart = todayStart - 86400 * 1000;
      const today = countBetween(todayStart, now.getTime());
      const yesterday = countBetween(yesterdayStart, yesterdayStart + dayElapsed);
      const dayMax = Math.max(today, yesterday, 1);

      els.todayCount.textContent = sessionsLabel(today);
      els.yesterdayCount.textContent = sessionsLabel(yesterday);
      els.todayFill.style.width = `${(today / dayMax) * 100}%`;
      els.yesterdayFill.style.width = `${(yesterday / dayMax) * 100}%`;
    }

    function renderHeatmap() {
      const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      els.hourGrid.innerHTML = days.map((day, dayIndex) => {
        const weekdaySessions = state.sessions.filter((session) => {
          const date = new Date(session.completedAt);
          return ((date.getDay() + 6) % 7) === dayIndex;
        });
        const counts = hourCounts(weekdaySessions);
        const cells = counts.map((count, hour) => {
          const level = Math.min(count, 4);
          const label = `${day} ${hour}:00, ${count} focus ${count === 1 ? "session" : "sessions"} in history`;
          return `<div class="hour level-${level}" title="${label}" aria-label="${label}">${count === 0 ? "" : count}</div>`;
        }).join("");

        return `<div class="day-label">${day}</div>${cells}`;
      }).join("");
    }

    function isSyncEnabled() {
      return Boolean(syncConfig && syncConfig.supabaseUrl && syncConfig.supabaseAnonKey && syncConfig.syncKeyHash);
    }

    async function supabaseRpc(functionName, body) {
      if (!isSyncEnabled()) return null;

      const response = await fetch(`${syncConfig.supabaseUrl}/rest/v1/rpc/${functionName}`, {
        method: "POST",
        headers: {
          "apikey": syncConfig.supabaseAnonKey,
          "Authorization": `Bearer ${syncConfig.supabaseAnonKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        throw new Error(`${functionName} failed: ${response.status}`);
      }

      return response.json();
    }

    function normalizeRemoteSession(session) {
      const completedAt = session.completed_at || session.completedAt;
      return {
        id: session.id,
        date: todayKey(new Date(completedAt)),
        startedAt: session.started_at || session.startedAt,
        completedAt,
        durationSeconds: session.duration_seconds || session.durationSeconds,
        clientId: session.client_id || session.clientId
      };
    }

    async function loadRemoteSessions() {
      if (!isSyncEnabled()) {
        setSyncStatus("Local only", "local");
        return false;
      }

      try {
        setSyncStatus("Syncing", "syncing");
        const sessions = await supabaseRpc("list_focus_sessions", {
          p_sync_key_hash: syncConfig.syncKeyHash
        });
        state.sessions = sessions.map(normalizeRemoteSession);
        saveState();
        render();
        setSyncStatus("Synced", "synced");
        return true;
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
        return false;
      }
    }

    async function createRemoteSession(session) {
      if (!isSyncEnabled()) {
        setSyncStatus("Local only", "local");
        return;
      }

      try {
        setSyncStatus("Syncing", "syncing");
        await supabaseRpc("create_focus_session", {
          p_sync_key_hash: syncConfig.syncKeyHash,
          p_started_at: session.startedAt,
          p_completed_at: session.completedAt,
          p_duration_seconds: session.durationSeconds,
          p_client_id: session.clientId
        });
        await loadRemoteSessions();
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
      }
    }

    async function undoRemoteSession() {
      if (!isSyncEnabled()) {
        setSyncStatus("Local only", "local");
        return;
      }

      try {
        setSyncStatus("Syncing", "syncing");
        await supabaseRpc("undo_latest_focus_session", {
          p_sync_key_hash: syncConfig.syncKeyHash,
          p_completed_after: localStartOfTodayIso()
        });
        await loadRemoteSessions();
      } catch (error) {
        console.warn(error);
        setSyncStatus("Sync issue", "issue");
      }
    }

    els.mainButton.addEventListener("click", handleMainAction);
    els.undoButton.addEventListener("click", undoLast);

    window.addEventListener("beforeunload", saveState);
    window.addEventListener("focus", () => {
      loadRemoteSessions();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadRemoteSessions();
    });

    async function init() {
      syncConfig = await configureSyncFromUrl();
      setSyncStatus(isSyncEnabled() ? "Syncing" : "Local only", isSyncEnabled() ? "syncing" : "local");

      if (state.activeSession && state.activeSession.pausedRemainingSeconds === null) {
        startTick();
      }

      render();
      setInterval(maybeShowIdleNudge, 30 * 1000);
      await loadRemoteSessions();
    }

    init();
  </script>
</body>
</html>
