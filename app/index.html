<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>&#8203;</title>
  <link rel="icon" id="favicon" href="./favicon.svg?v=3" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --ink: #fafafa;
      --ink-2: #e4e4e7;
      --muted: #a1a1aa;
      --line: #27272a;
      --chip: #27272a;
      --hover: rgba(250, 250, 250, 0.08);
      --surface: #09090b;
      font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .app {
      position: relative;
      display: grid;
      gap: 24px;
      width: min(720px, calc(100vw - 28px));
      padding: 40px 26px 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .timer {
      display: grid;
      gap: 12px;
      justify-items: center;
      padding: 10px 0 2px;
    }

    .state {
      min-height: 21px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(70px, 20vw, 96px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .last-session {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      text-align: center;
      margin-top: -2px;
    }

    .last-session[hidden] {
      display: none;
    }

    .tabs {
      display: flex;
      justify-content: center;
    }

    .tabs-list {
      display: inline-flex;
      gap: 2px;
      background: var(--chip);
      border-radius: 8px;
      padding: 3px;
    }

    .tab-trigger {
      min-height: 32px;
      padding: 0 22px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .tab-trigger.active {
      background: var(--bg);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .week-pace[hidden],
    .heatmap[hidden] {
      display: none;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .primary {
      background: var(--ink);
      color: #18181b;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .primary:hover {
      background: var(--ink-2);
    }

    .secondary {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
    }

    .secondary:hover:not(:disabled) {
      background: var(--hover);
    }

    .small-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .small-actions button {
      min-height: 36px;
      padding: 0 14px;
      color: var(--ink);
      font-size: 14px;
    }

    .break-btn {
      color: var(--muted);
    }

    .time.break {
      color: #4ade80;
    }

    .streak {
      position: absolute;
      top: 14px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .streak[hidden] {
      display: none;
    }

    .streak svg {
      width: 13px;
      height: 13px;
    }

    .sync-status {
      position: absolute;
      top: 14px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .sync-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #f87171;
    }

    .sync-status[data-status="synced"]::before,
    .sync-status[data-status="syncing"]::before {
      background: #4ade80;
    }

    .sync-status[data-status="syncing"]::before {
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    .week-pace {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .pace-row {
      display: grid;
      grid-template-columns: 100px 1fr 86px;
      gap: 12px;
      align-items: center;
    }

    .pace-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.15;
      white-space: nowrap;
    }

    .pace-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(250, 250, 250, 0.12);
      overflow: hidden;
    }

    .pace-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: var(--ink);
    }

    .pace-fill.past {
      background: #52525b;
    }

    .pace-count {
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .pace-count.past {
      color: var(--muted);
    }

    .pace-group-end {
      margin-bottom: 8px;
    }

    .heatmap {
      display: grid;
      gap: 10px;
      padding-top: 2px;
    }

    .day-grid {
      display: grid;
      grid-template-columns: 48px repeat(24, minmax(0, 1fr));
      gap: 3px;
      align-items: center;
    }

    .day-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hour {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 2px;
      background: var(--chip);
      font-size: 9px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--muted);
    }

    .hour.level-1 { background: #3f3f46; color: #d4d4d8; }
    .hour.level-2 { background: #71717a; color: #fafafa; }
    .hour.level-3 { background: #d4d4d8; color: #18181b; }
    .hour.level-4 { background: #fafafa; color: #18181b; }

    .hour-labels {
      display: grid;
      grid-template-columns: 48px repeat(24, minmax(0, 1fr));
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .hour-labels span {
      text-align: center;
    }

    .hour-labels .label-12a {
      grid-column: 2;
    }

    .hour-labels .label-6a {
      grid-column: 8;
    }

    .hour-labels .label-12p {
      grid-column: 14;
    }

    .hour-labels .label-6p {
      grid-column: 20;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Focus session timer">
    <div class="streak" id="streak" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      <span id="streakCount"></span>
    </div>
    <section class="timer">
      <div class="state" id="state">0 sessions today</div>
      <div class="time" id="time">30:00</div>
      <div class="last-session" id="lastSession" hidden></div>
    </section>

    <section class="actions">
      <button class="primary" id="mainButton" type="button">Start</button>
      <div class="small-actions">
        <button class="secondary" id="undoButton" type="button">Undo</button>
        <button class="secondary break-btn" id="break5Button" type="button" data-break-minutes="5">Break 5m</button>
        <button class="secondary break-btn" id="break10Button" type="button" data-break-minutes="10">Break 10m</button>
        <button class="secondary break-btn" id="break20Button" type="button" data-break-minutes="20">Break 20m</button>
        <button class="secondary" id="skipBreakButton" type="button" hidden>Skip break</button>
      </div>
    </section>

    <div class="tabs">
      <div class="tabs-list" role="tablist">
        <button class="tab-trigger active" id="paceTab" type="button" role="tab">Pace</button>
        <button class="tab-trigger" id="heatmapTab" type="button" role="tab">Heatmap</button>
      </div>
    </div>

    <section class="week-pace" id="pacePanel" aria-label="Today and this week versus the same point before">
      <div class="pace-row">
        <div class="pace-label">Today</div>
        <div class="pace-bar"><div class="pace-fill" id="todayFill"></div></div>
        <div class="pace-count" id="todayCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label" id="compareDayLabel" title="The most recent day of the same kind, full day">Last weekday</div>
        <div class="pace-bar"><div class="pace-fill past" id="yesterdayFill"></div></div>
        <div class="pace-count past" id="yesterdayCount">0</div>
      </div>
      <div class="pace-row pace-group-end">
        <div class="pace-label" id="compareAvgLabel" title="Average per day of the same kind over the last 4 full weeks">Weekday avg</div>
        <div class="pace-bar"><div class="pace-fill past" id="compareAvgFill"></div></div>
        <div class="pace-count past" id="compareAvgCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label">Week</div>
        <div class="pace-bar"><div class="pace-fill" id="thisWeekFill"></div></div>
        <div class="pace-count" id="thisWeekCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label" title="Last week, by this point of the week">Last week</div>
        <div class="pace-bar"><div class="pace-fill past" id="lastWeekFill"></div></div>
        <div class="pace-count past" id="lastWeekCount">0</div>
      </div>
      <div class="pace-row">
        <div class="pace-label" title="Average sessions per week over the last 4 full weeks">4 weeks avg</div>
        <div class="pace-bar"><div class="pace-fill past" id="last4WeeksFill"></div></div>
        <div class="pace-count past" id="last4WeeksCount">0</div>
      </div>
    </section>

    <section class="heatmap" id="heatmapPanel" aria-label="Focus sessions by hour" hidden>
      <h2 class="visually-hidden">Global history by weekday and hour</h2>
      <div class="day-grid" id="hourGrid"></div>
      <div class="hour-labels" aria-hidden="true">
        <span></span>
        <span class="label-12a">12a</span>
        <span class="label-6a">6a</span>
        <span class="label-12p">12p</span>
        <span class="label-6p">6p</span>
      </div>
    </section>

    <div class="sync-status" id="syncStatus" data-status="local">Local only</div>
  </main>

  <script>
    const storageKey = "focus-sessions.v1";
    const legacyConfigStorageKey = "focus-sessions.sync-config.v1";
    const authMigratedStorageKey = "focus-sessions.auth-migrated.v1";
    const lastUidStorageKey = "focus-sessions.last-uid.v1";
    const pendingStorageKey = "focus-sessions.pending.v1";
    const syncCursorsStorageKey = "focus-sessions.sync-cursors.v1";
    const clientIdStorageKey = "focus-sessions.client-id.v1";
    // Firebase web config is public by design; identity and access control
    // come from Google sign-in + Firestore rules, not these values.
    const FIREBASE = {
      apiKey: "AIzaSyA5_DhdTdqjCVDeOgklUFcnJ1lwfESiP8Y",
      authDomain: "my-reading-list-3fa75.firebaseapp.com",
      projectId: "my-reading-list-3fa75",
      appId: "1:101190488885:web:f0401ddd67b862f163b27c"
    };
    // The old Supabase endpoint, kept only for the one-time import of
    // bookmark-era history after first sign-in. URL and anon key are public
    // values; the tenant secret (the sync-key hash) never leaves localStorage.
    const LEGACY_SUPABASE_URL = "https://nasqsmpwovgpyjepgidi.supabase.co";
    const LEGACY_SUPABASE_ANON_KEY = "sb_publishable_X9E1yEANHLdWINHEAAVZ6w_lNn_xw2G";
    const defaultSessionSeconds = 30 * 60;
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const urlSeconds = Number(params.get("seconds"));
    const sessionSeconds = Number.isFinite(urlSeconds) && urlSeconds > 0 ? urlSeconds : defaultSessionSeconds;
    const urlNudgeAfter = Number(params.get("nudge_after"));
    const idleNudgeAfterSeconds = Number.isFinite(urlNudgeAfter) && urlNudgeAfter > 0 ? urlNudgeAfter : 15 * 60;
    const idleNudgeMaxAgeSeconds = idleNudgeAfterSeconds + 75 * 60;
    const urlBreakNudgeAfter = Number(params.get("break_nudge_after"));
    const breakNudgeAfterSeconds = Number.isFinite(urlBreakNudgeAfter) && urlBreakNudgeAfter > 0
      ? urlBreakNudgeAfter
      : 5 * 60;

    const els = {
      time: document.querySelector("#time"),
      state: document.querySelector("#state"),
      lastSession: document.querySelector("#lastSession"),
      paceTab: document.querySelector("#paceTab"),
      heatmapTab: document.querySelector("#heatmapTab"),
      pacePanel: document.querySelector("#pacePanel"),
      heatmapPanel: document.querySelector("#heatmapPanel"),
      mainButton: document.querySelector("#mainButton"),
      undoButton: document.querySelector("#undoButton"),
      breakButtons: Array.from(document.querySelectorAll("[data-break-minutes]")),
      skipBreakButton: document.querySelector("#skipBreakButton"),
      syncStatus: document.querySelector("#syncStatus"),
      hourGrid: document.querySelector("#hourGrid"),
      todayFill: document.querySelector("#todayFill"),
      todayCount: document.querySelector("#todayCount"),
      yesterdayFill: document.querySelector("#yesterdayFill"),
      yesterdayCount: document.querySelector("#yesterdayCount"),
      compareDayLabel: document.querySelector("#compareDayLabel"),
      compareAvgLabel: document.querySelector("#compareAvgLabel"),
      compareAvgFill: document.querySelector("#compareAvgFill"),
      compareAvgCount: document.querySelector("#compareAvgCount"),
      thisWeekFill: document.querySelector("#thisWeekFill"),
      thisWeekCount: document.querySelector("#thisWeekCount"),
      lastWeekFill: document.querySelector("#lastWeekFill"),
      lastWeekCount: document.querySelector("#lastWeekCount"),
      last4WeeksFill: document.querySelector("#last4WeeksFill"),
      last4WeeksCount: document.querySelector("#last4WeeksCount"),
      streak: document.querySelector("#streak"),
      streakCount: document.querySelector("#streakCount")
    };

    let state = loadState();
    let tick = null;
    let authUser = null;        // { uid, email, getToken() } once signed in
    let authApi = null;         // { signIn, signOutUser } from the module script
    let authState = "loading";  // loading | out | in | unavailable
    let audioContext = null;

    function todayKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function localStartOfTodayIso() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    }

    function loadState() {
      // Breaks are deliberately local-only: they never reach Supabase or the stats.
      const fallback = {
        sessions: [],
        activeSession: null,
        completionPending: false,
        nudgedSessionId: null,
        activeBreak: null,
        breakEndedAt: null,
        breakNudgeSent: false
      };

      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || "{}");
        const sessions = Array.isArray(stored.sessions) ? stored.sessions : [];
        return {
          sessions,
          activeSession: stored.activeSession || null,
          completionPending: Boolean(stored.completionPending)
            && sessions.some((session) => session.date === todayKey()),
          nudgedSessionId: stored.nudgedSessionId || null,
          activeBreak: stored.activeBreak || null,
          breakEndedAt: stored.breakEndedAt || null,
          breakNudgeSent: Boolean(stored.breakNudgeSent)
        };
      } catch {
        return fallback;
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function setSyncStatus(label, status = "local") {
      els.syncStatus.textContent = label;
      els.syncStatus.dataset.status = status;
    }

    function loadLegacyConfig() {
      try {
        return JSON.parse(localStorage.getItem(legacyConfigStorageKey) || "null");
      } catch {
        return null;
      }
    }

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function createId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    }

    function clientId() {
      const existing = localStorage.getItem(clientIdStorageKey);
      if (existing) return existing;
      const next = createId();
      localStorage.setItem(clientIdStorageKey, next);
      return next;
    }

    function startSession() {
      state.activeSession = {
        id: createId(),
        startedAt: new Date().toISOString(),
        durationSeconds: sessionSeconds,
        pausedRemainingSeconds: null
      };
      state.completionPending = false;
      clearBreak();
      startTick();
      render();
      saveState();
    }

    function startBreak(minutes) {
      if (state.activeSession) return;
      prepareAlerts();
      state.activeBreak = {
        startedAt: new Date().toISOString(),
        durationSeconds: minutes * 60
      };
      state.breakEndedAt = null;
      state.breakNudgeSent = false;
      startTick();
      render();
      saveState();
    }

    function clearBreak() {
      state.activeBreak = null;
      state.breakEndedAt = null;
      state.breakNudgeSent = false;
    }

    function skipBreak() {
      clearBreak();
      stopTickIfIdle();
      render();
      saveState();
    }

    function breakRemainingSeconds() {
      if (!state.activeBreak) return 0;
      const startedAt = new Date(state.activeBreak.startedAt).getTime();
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      return Math.max(0, state.activeBreak.durationSeconds - elapsed);
    }

    function settleExpiredBreak() {
      if (!state.activeBreak || breakRemainingSeconds() > 0) return;

      const endedAt = new Date(state.activeBreak.startedAt).getTime()
        + state.activeBreak.durationSeconds * 1000;
      // A break that ran out while the tab was closed is stale; settle it quietly.
      const stale = Date.now() - endedAt > breakNudgeAfterSeconds * 1000;

      state.activeBreak = null;
      state.breakEndedAt = stale ? null : new Date(endedAt).toISOString();
      state.breakNudgeSent = false;
      stopTickIfIdle();
      saveState();

      if (stale) return;
      showNotification("Break over", "Time to get back to work.");
    }

    function maybeShowBreakNudge() {
      if (state.breakNudgeSent || !state.breakEndedAt) return;
      if (state.activeSession || state.activeBreak) return;

      const idleSeconds = (Date.now() - new Date(state.breakEndedAt).getTime()) / 1000;
      if (idleSeconds < breakNudgeAfterSeconds) return;

      state.breakNudgeSent = true;
      saveState();
      showNotification("Still on break?", "Your break ended 5 minutes ago. Start a session.");
    }

    function pauseSession() {
      if (!state.activeSession) return;
      state.activeSession.pausedRemainingSeconds = remainingSeconds();
      stopTick();
      render();
      saveState();
    }

    function resumeSession() {
      if (!state.activeSession) return;
      const remaining = state.activeSession.pausedRemainingSeconds || sessionSeconds;
      const elapsedSeconds = state.activeSession.durationSeconds - remaining;
      state.activeSession.startedAt = new Date(Date.now() - elapsedSeconds * 1000).toISOString();
      state.activeSession.pausedRemainingSeconds = null;
      startTick();
      render();
      saveState();
    }

    function handleMainAction() {
      prepareAlerts();

      if (!state.activeSession) {
        startSession();
        return;
      }

      if (state.activeSession.pausedRemainingSeconds !== null) {
        resumeSession();
      } else {
        pauseSession();
      }
    }

    function completeSession() {
      if (!state.activeSession) return;
      const now = new Date();
      const session = {
        id: state.activeSession.id,
        date: todayKey(now),
        startedAt: state.activeSession.startedAt,
        completedAt: now.toISOString(),
        durationSeconds: state.activeSession.durationSeconds,
        clientId: clientId()
      };
      state.sessions.push(session);
      state.activeSession = null;
      state.completionPending = true;
      stopTick();
      render();
      saveState();
      alertCompletion();
      createRemoteSession(session);
    }

    function undoLast() {
      const today = todayKey();
      const index = state.sessions.map((session) => session.date).lastIndexOf(today);
      if (index >= 0) {
        const [removed] = state.sessions.splice(index, 1);
        state.completionPending = false;
        render();
        saveState();
        undoRemoteSession(removed);
      }
    }

    function remainingSeconds() {
      if (!state.activeSession) return sessionSeconds;
      if (state.activeSession.pausedRemainingSeconds !== null) {
        return state.activeSession.pausedRemainingSeconds;
      }

      const startedAt = new Date(state.activeSession.startedAt).getTime();
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      return Math.max(0, state.activeSession.durationSeconds - elapsed);
    }

    function settleExpiredSession() {
      if (!state.activeSession || state.activeSession.pausedRemainingSeconds !== null) return;
      if (remainingSeconds() === 0) {
        completeSession();
      }
    }

    function startTick() {
      stopTick();
      tick = setInterval(() => {
        settleExpiredSession();
        settleExpiredBreak();
        render();
        saveState();
      }, 1000);
    }

    function stopTick() {
      if (tick) {

    function prepareAlerts() {

      requestNotificationPermission();
    }

    function prepareAudio() {
      try {

        }
      } catch (error) {
        console.warn(error);

      }

    function alertCompletion() {
      showCompletionNotification();
    }

          chimeVoice(1318.5, 0.3, 1.6, 0.055, 0.35);

          chimeVoice(2093, 0.9, 2.0, 0.04, 0.4);
        }).catch(() => {});
      } catch (error) {
        console.warn(error);
      }

      oscillator.frequency.setValueAtTime(frequency, start);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(4000, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      filter.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.05);

      playChime();

      notification.onclick = () => {

        notification.close();

      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (state.activeSession || state.activeBreak) return;

      const last = sessionsToday().reduce((latest, session) => {
        if (!latest) return session;
        return session.completedAt > latest.completedAt ? session : latest;
      }, null);
      if (!last || last.id === state.nudgedSessionId) return;

      // Only nudge in the window where a forgotten restart is plausible.
      const idleSeconds = (Date.now() - new Date(last.completedAt).getTime()) / 1000;
      if (idleSeconds < idleNudgeAfterSeconds || idleSeconds > idleNudgeMaxAgeSeconds) return;

      state.nudgedSessionId = last.id;
      saveState();
      showNotification("Still working?", "No session running. Start one so it counts.");

    function renderLastSession() {
      const latest = state.sessions.reduce((max, session) => {
        return !max || session.completedAt > max ? session.completedAt : max;
      }, null);
      els.lastSession.hidden = !latest;
      if (!latest) return;

      const minutesAgo = Math.max(0, Math.floor((Date.now() - new Date(latest).getTime()) / 60000));
      const hours = Math.floor(minutesAgo / 60);
      const minutes = minutesAgo % 60;
      els.lastSession.textContent = `Last session: ${hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`}`;
    }

    function sessionsLabel(count) {
      return `${count} ${count === 1 ? "session" : "sessions"}`;
    }

    function streakDays() {
      // Consecutive days with at least one session, ending today or yesterday.
      const dates = new Set(state.sessions.map((session) => session.date));
      const cursor = new Date();
      if (!dates.has(todayKey(cursor))) {
        cursor.setDate(cursor.getDate() - 1);
        if (!dates.has(todayKey(cursor))) return 0;
      }

      let days = 0;
      while (dates.has(todayKey(cursor))) {
        days += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return days;
    }

    function renderStreak() {
      const days = streakDays();
      els.streak.hidden = days === 0;
      els.streakCount.textContent = `${days} day streak`;
    }

    function renderWeekPace() {
      // Weeks run Saturday 00:00 -> Friday 24:00, local time (same as the weekly email).
      // "This week" and "Today" are in-progress periods; "Last week", "Last 4 weeks",
      // and the compare-day row are always full, completed periods. The compare day
      // is the most recent day of the same kind as today: weekdays compare against
      // the previous Mon-Fri day, weekend days against the previous Sat/Sun.
      const now = new Date();
      const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 1) % 7));
      const lastWeekStart = weekStart.getTime() - 7 * 86400 * 1000;

      const countBetween = (lo, hi) => state.sessions.filter((session) => {
        const at = new Date(session.completedAt).getTime();
        return at >= lo && at < hi;
      }).length;

      const thisWeek = countBetween(weekStart.getTime(), now.getTime());
      const lastWeek = countBetween(lastWeekStart, lastWeekStart + 7 * 86400 * 1000);
      let last4Total = 0;
      for (let weeksBack = 1; weeksBack <= 4; weeksBack += 1) {
        const start = weekStart.getTime() - weeksBack * 7 * 86400 * 1000;
        last4Total += countBetween(start, start + 7 * 86400 * 1000);
      }
      const last4Avg = Math.round(last4Total / 4);
      const paceMax = Math.max(thisWeek, lastWeek, last4Avg, 1);

      els.thisWeekCount.textContent = sessionsLabel(thisWeek);
      els.lastWeekCount.textContent = sessionsLabel(lastWeek);
      els.last4WeeksCount.textContent = sessionsLabel(last4Avg);
      els.thisWeekFill.style.width = `${(thisWeek / paceMax) * 100}%`;
      els.lastWeekFill.style.width = `${(lastWeek / paceMax) * 100}%`;
      els.last4WeeksFill.style.width = `${(last4Avg / paceMax) * 100}%`;

      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const isWeekend = (date) => date.getDay() === 0 || date.getDay() === 6;
      const todayIsWeekend = isWeekend(now);
      const compareDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      do { compareDay.setDate(compareDay.getDate() - 1); } while (isWeekend(compareDay) !== todayIsWeekend);
      const compareDayEnd = new Date(compareDay.getFullYear(), compareDay.getMonth(), compareDay.getDate() + 1);
      els.compareDayLabel.textContent = todayIsWeekend ? "Last weekend" : "Last weekday";
      const today = countBetween(todayStart, now.getTime());
      const yesterday = countBetween(compareDay.getTime(), compareDayEnd.getTime());

      // Average per day of today's kind (weekday or weekend day) over the last 4 full weeks.
      let compareTypeTotal = 0;
      let compareTypeDays = 0;
      for (let daysBack = 1; daysBack <= 28; daysBack += 1) {
        const dayStart = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() - daysBack);
        if (isWeekend(dayStart) !== todayIsWeekend) continue;
        const dayEnd = new Date(dayStart.getFullYear(), dayStart.getMonth(), dayStart.getDate() + 1);
        compareTypeDays += 1;
        compareTypeTotal += countBetween(dayStart.getTime(), dayEnd.getTime());
      }
      const compareAvg = compareTypeDays ? Math.round((compareTypeTotal / compareTypeDays) * 10) / 10 : 0;
      els.compareAvgLabel.textContent = todayIsWeekend ? "Weekend avg" : "Weekday avg";
      const dayMax = Math.max(today, yesterday, compareAvg, 1);

      els.todayCount.textContent = sessionsLabel(today);
      els.yesterdayCount.textContent = sessionsLabel(yesterday);
      els.compareAvgCount.textContent = sessionsLabel(compareAvg);
      els.todayFill.style.width = `${(today / dayMax) * 100}%`;
      els.yesterdayFill.style.width = `${(yesterday / dayMax) * 100}%`;
      els.compareAvgFill.style.width = `${(compareAvg / dayMax) * 100}%`;
    }

    function renderHeatmap() {
      const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      els.hourGrid.innerHTML = days.map((day, dayIndex) => {
        const weekdaySessions = state.sessions.filter((session) => {
          const date = new Date(session.completedAt);
          return ((date.getDay() + 6) % 7) === dayIndex;
        });
        const counts = hourCounts(weekdaySessions);
        const cells = counts.map((count, hour) => {
          const level = Math.min(count, 4);
          const label = `${day} ${hour}:00, ${count} focus ${count === 1 ? "session" : "sessions"} in history`;
          return `<div class="hour level-${level}" title="${label}" aria-label="${label}">${count === 0 ? "" : count}</div>`;
        }).join("");

        return `<div class="day-label">${day}</div>${cells}`;
      }).join("");
    }

    function isSyncEnabled() {
      return Boolean(authUser);
    }

    // ---- Firestore REST: minimal typed-value encode/decode (same approach
    // as brain-gym — the SDK is only loaded for Auth, not for data) ----
    function fsValue(v) {
      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === "string") return { stringValue: v };
      if (typeof v === "boolean") return { booleanValue: v };
      if (v instanceof Date) return { timestampValue: v.toISOString() };
      if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
      throw new Error("fsValue: unsupported type " + typeof v);

      const out = {};
      for (const key of Object.keys(obj)) out[key] = fsValue(obj[key]);
      return out;
    }

    function fsDecode(v) {
      if (!v) return null;
      if ("stringValue" in v) return v.stringValue;
      if ("integerValue" in v) return parseInt(v.integerValue, 10);
      if ("doubleValue" in v) return v.doubleValue;
      if ("booleanValue" in v) return v.booleanValue;
      if ("timestampValue" in v) return v.timestampValue;
      if ("nullValue" in v) return null;
      return null;
    }

    function fsDecodeFields(fields) {
      const out = {};
      for (const key of Object.keys(fields)) out[key] = fsDecode(fields[key]);
      return out;
    }

    function fsBase() {
      return `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents`;
    }

    function fsDocName(id) {
      return `projects/${FIREBASE.projectId}/databases/(default)/documents/users/${authUser.uid}/focus_sessions/${id}`;
    }

    async function fsAuthHeaders() {
      return { Authorization: `Bearer ${await authUser.getToken()}` };
    }

    // Create-only (a retried save of the same id is a clean no-op) with
    // createdAt set to the server's own time — matching the Firestore rules.
    async function fsCreateSession(session) {
      const res = await fetch(`${fsBase()}:commit?key=${encodeURIComponent(FIREBASE.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await fsAuthHeaders()) },
        body: JSON.stringify({
          writes: [{
            update: {
              name: fsDocName(session.id),
              fields: fsFields({
                startedAt: new Date(session.startedAt),
                completedAt: new Date(session.completedAt),
                durationSeconds: session.durationSeconds,
                clientId: session.clientId || clientId(),
                deletedAt: null
              })
            },
            updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
            currentDocument: { exists: false }
          }]
        })
      });
      if (res.status === 409) return false;
      if (!res.ok) throw await fsError("fsCreateSession", res);
      return true;

    async function fsError(where, res) {
      let detail = "";
      try { detail = JSON.stringify(await res.json()).slice(0, 300); } catch { /* body unreadable */ }
      const error = new Error(`${where}: HTTP ${res.status} ${detail}`);
      error.status = res.status;
      return error;
    }

    // One page-walking query over focus_sessions ordered by `field`,
    // optionally only rows with field > afterIso. Rows keep their doc id and
    // the raw ordering value so callers can advance cursors — including past
    // soft-deleted rows, which callers may still need to see.
    async function fsQuerySessions(field, afterIso) {
      const parent = `${fsBase()}/users/${authUser.uid}`;
      const rows = [];
      let cursorIso = afterIso || null;
      for (;;) {
        const structuredQuery = {
          from: [{ collectionId: "focus_sessions" }],
          orderBy: [
            { field: { fieldPath: field }, direction: "ASCENDING" },
            { field: { fieldPath: "__name__" }, direction: "ASCENDING" }
          ],
          limit: 300
        };
        if (cursorIso) {
          structuredQuery.where = {
            fieldFilter: { field: { fieldPath: field }, op: "GREATER_THAN", value: { timestampValue: cursorIso } }
          };
        }
        const res = await fetch(`${parent}:runQuery?key=${encodeURIComponent(FIREBASE.apiKey)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...(await fsAuthHeaders()) },
          body: JSON.stringify({ structuredQuery })
        });
        if (!res.ok) throw await fsError("fsQuerySessions(" + field + ")", res);
        const page = (await res.json()).filter((row) => row.document);
        for (const row of page) {
          const data = fsDecodeFields(row.document.fields || {});
          cursorIso = data[field];
          rows.push({ id: row.document.name.split("/").pop(), ...data });
        }
        if (page.length < 300) break;
      }
      return rows;
    }

    // Soft-delete one session by id — writing only deletedAt, the narrow
    // update the Firestore rules allow. Costs zero reads.
    async function fsSoftDelete(sessionId) {
      const res = await fetch(`${fsBase()}:commit?key=${encodeURIComponent(FIREBASE.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await fsAuthHeaders()) },
        body: JSON.stringify({
          writes: [{
            update: { name: fsDocName(sessionId), fields: fsFields({ deletedAt: new Date() }) },
            updateMask: { fieldPaths: ["deletedAt"] },
            currentDocument: { exists: true }
          }]
        })
      });
      if (!res.ok) throw await fsError("fsSoftDelete", res);
    }

    // ---- Pending outbox: completed sessions queue here until the server
    // confirms them, so nothing ever depends on being online or signed in
    // at the moment a pomodoro ends ----
    function loadPending() {
      try { return JSON.parse(localStorage.getItem(pendingStorageKey)) || []; } catch { return []; }
    }
    function savePending(rows) { localStorage.setItem(pendingStorageKey, JSON.stringify(rows)); }

    function isValidSessionRow(row) {
      return row && row.id
        && Number.isFinite(new Date(row.completedAt).getTime())
        && Number.isFinite(new Date(row.startedAt).getTime())
        && Number.isFinite(row.durationSeconds) && row.durationSeconds > 0;
    }

    function addPending(session) {
      const rows = loadPending();
      if (!rows.some((row) => row.id === session.id)) rows.push(session);
      savePending(rows);
    }

    // Push every queued row create-only (409 = already there, done). Rows
    // that fail transiently stay queued; malformed rows are dropped so one
    // bad row can never wedge the queue. Returns the first error seen so the
    // caller can surface rate limiting.
    async function flushPending() {
      let firstError = null;
      const remaining = [];
      for (const row of loadPending()) {
        if (!isValidSessionRow(row)) {
          console.warn("Dropping malformed pending session:", row);
          continue;
        }
        try {
          await fsCreateSession(row);
        } catch (error) {
          console.warn("Keeping pending session for retry:", row.id, error);
          firstError = firstError || error;
          remaining.push(row);
        }
      }
      savePending(remaining);
      return { remaining: remaining.length, error: firstError };
    }

    function loadCursors() {
      try { return JSON.parse(localStorage.getItem(syncCursorsStorageKey)); } catch { return null; }
    }
    function saveCursors(cursors) { localStorage.setItem(syncCursorsStorageKey, JSON.stringify(cursors)); }

    function mergeServerRows(newRows, deletedIds) {
      const byId = new Map(state.sessions.filter(isValidSessionRow).map((row) => [row.id, row]));
      for (const row of newRows) {
        if (!row.deletedAt) byId.set(row.id, normalizeRemoteSession(row));
      }
      for (const id of deletedIds) byId.delete(id);
      state.sessions = [...byId.values()]
        .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
    }

    // One-time, per device: everything this device knows locally (on a
    // synced device that is the full fetched history) plus whatever the old
    // Supabase tenant still returns, pushed create-only under the account.
    // Preserved ids make re-runs and device races harmless.
    async function importLegacyIfNeeded() {
      if (localStorage.getItem(authMigratedStorageKey) === "done") return;

      const known = state.sessions.filter((session) => session.id && session.completedAt);

      let legacyRows = [];
      const legacy = loadLegacyConfig();
      if (legacy && legacy.syncKeyHash) {
        try {
          const response = await fetch(`${LEGACY_SUPABASE_URL}/rest/v1/rpc/list_focus_sessions`, {
            method: "POST",
            headers: {
              "apikey": LEGACY_SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${LEGACY_SUPABASE_ANON_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ p_sync_key_hash: legacy.syncKeyHash })
          });
          if (response.ok) legacyRows = (await response.json()).map(normalizeRemoteSession);
        } catch (error) {
          console.warn("Legacy Supabase read failed (will retry next sign-in):", error);
        }
      }

      const byId = new Map();
      for (const row of [...known, ...legacyRows]) byId.set(row.id, row);
      for (const row of byId.values()) await fsCreateSession(row);
      localStorage.setItem(authMigratedStorageKey, "done");
    }

    function normalizeRemoteSession(session) {
      const completedAt = session.completed_at || session.completedAt;
      return {
        id: session.id,
        date: todayKey(new Date(completedAt)),
        startedAt: session.started_at || session.startedAt,
        completedAt,
        durationSeconds: session.duration_seconds || session.durationSeconds,
        clientId: session.client_id || session.clientId
      };
    }

    // ---- Sync v2: seed once per device, then tiny cursor deltas ----
    // The old model refetched the ENTIRE history on every window focus,
    // which burned through Firestore's free read quota (HTTP 429). Now a
    // device pays the full read once (seed), and every later sync costs two
    // ~empty queries: new sessions by server-set createdAt, and undos by
    // deletedAt (with a 10-minute lookback to absorb device clock skew —
    // re-applying a deletion is a no-op).
    const SYNC_MIN_INTERVAL_MS = 60e3;
    const RATE_LIMIT_BACKOFF_MS = 5 * 60e3;
    const DELETE_LOOKBACK_MS = 10 * 60e3;
    let syncInFlight = false;
    let lastSyncAt = 0;
    let backoffUntil = 0;

    async function seedSync() {
      const all = await fsQuerySessions("createdAt", null);
      const serverIds = new Set(all.map((row) => row.id));
      // Anything this device knows that the server doesn't becomes pending
      // (create-only + preserved ids keep re-runs and device races harmless).
      for (const row of state.sessions) {
        if (isValidSessionRow(row) && !serverIds.has(row.id)) addPending(row);
      }
      mergeServerRows(all, []);
      saveCursors({
        created: all.length ? all[all.length - 1].createdAt : null,
        deleted: new Date().toISOString()
      });
    }

    async function deltaSync(cursors) {
      const created = cursors.created
        ? await fsQuerySessions("createdAt", cursors.created)
        : await fsQuerySessions("createdAt", null);
      const lookback = new Date(new Date(cursors.deleted).getTime() - DELETE_LOOKBACK_MS).toISOString();
      const deleted = await fsQuerySessions("deletedAt", lookback);
      mergeServerRows(created, deleted.map((row) => row.id));
      saveCursors({
        created: created.length ? created[created.length - 1].createdAt : cursors.created,
        deleted: deleted.length
          ? deleted.map((row) => row.deletedAt).sort().pop()
          : cursors.deleted
      });
    }

    async function syncSessions(force = false) {
      if (!isSyncEnabled()) {
        setSyncStatus(authState === "unavailable" ? "Offline" : "Sign in to sync", authState === "unavailable" ? "issue" : "local");
        return false;
      }
      const now = Date.now();
      if (syncInFlight) return false;
      if (!force && (now < backoffUntil || now - lastSyncAt < SYNC_MIN_INTERVAL_MS)) return false;

      syncInFlight = true;
      try {
        setSyncStatus("Syncing", "syncing");
        const cursors = loadCursors();
        if (cursors) await deltaSync(cursors); else await seedSync();
        // Flush AFTER the pull: the seed may have just queued rows the
        // server lacks, and they should reach it in this same pass.
        const flush = await flushPending();
        if (flush.error) throw flush.error;
        lastSyncAt = Date.now();
        saveState();
        render();
        setSyncStatus("Synced", "synced");
        return true;
      } catch (error) {
        console.warn(error);
        if (error && error.status === 429) {
          backoffUntil = Date.now() + RATE_LIMIT_BACKOFF_MS;
          setSyncStatus("Rate limited", "issue");
          setTimeout(() => syncSessions(), RATE_LIMIT_BACKOFF_MS + 1000);
        } else {
          setSyncStatus("Sync issue", "issue");
        }
        return false;
      } finally {
        syncInFlight = false;
      }
    }

    async function createRemoteSession(session) {
      // Queue first: the session is safe locally whatever the network does.
      addPending(session);
      if (!isSyncEnabled()) {
        setSyncStatus("Sign in to sync", "local");
        return;
      }

      setSyncStatus("Syncing", "syncing");
      const flush = await flushPending();
      if (!flush.error) {
        setSyncStatus("Synced", "synced");
      } else if (flush.error.status === 429) {
        backoffUntil = Date.now() + RATE_LIMIT_BACKOFF_MS;
        setSyncStatus("Rate limited", "issue");
      } else {
        setSyncStatus("Sync issue", "issue");
      }
    }

    async function undoRemoteSession(session) {
      // If it never reached the server it only needs to leave the queue.
      const pending = loadPending();
      const wasPending = pending.some((row) => row.id === session.id);
      if (wasPending) savePending(pending.filter((row) => row.id !== session.id));

      if (!isSyncEnabled()) {
        setSyncStatus("Sign in to sync", "local");
        return;
      }

      try {
        setSyncStatus("Syncing", "syncing");
        await fsSoftDelete(session.id);
        setSyncStatus("Synced", "synced");
      } catch (error) {
        // A 404/412 here just means the session was still queued and never
        // written — removing it from the queue above already undid it.
        if (wasPending) {
          setSyncStatus("Synced", "synced");
        } else {
          console.warn(error);
          setSyncStatus("Sync issue", "issue");
        }
      }
    }

    els.mainButton.addEventListener("click", handleMainAction);
    els.syncStatus.style.cursor = "pointer";
    els.syncStatus.addEventListener("click", async () => {
      if (authState === "out") {
        try { await authApi.signIn(); } catch (error) { console.warn(error); }
      } else if (authState === "in" && confirm("Sign out of sync on this device?")) {
        authApi.signOutUser();
      }
    });
    els.undoButton.addEventListener("click", undoLast);
    els.paceTab.addEventListener("click", () => selectPanel("pace"));
    els.heatmapTab.addEventListener("click", () => selectPanel("heatmap"));

    function selectPanel(panel) {
      const showPace = panel === "pace";
      els.paceTab.classList.toggle("active", showPace);
      els.heatmapTab.classList.toggle("active", !showPace);
      els.pacePanel.hidden = !showPace;
      els.heatmapPanel.hidden = showPace;
    }
    els.skipBreakButton.addEventListener("click", skipBreak);
    els.breakButtons.forEach((button) => {
      button.addEventListener("click", () => startBreak(Number(button.dataset.breakMinutes)));
    });

    window.addEventListener("beforeunload", saveState);
    window.addEventListener("focus", () => {
      syncSessions();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) syncSessions();
    });

    // The module script at the bottom builds real Firebase Auth services
    // and calls start(); tests can pass fakes. The timer works fully signed
    // out — sessions stay local and follow the account after sign-in.
    window.PomodoroSync = {
      firebaseConfig: FIREBASE,
      start(api) {
        authApi = api;
        api.onAuthChange(async (user) => {
          authUser = user;
          authState = user ? "in" : "out";
          if (!user) {
            setSyncStatus("Sign in to sync", "local");
            return;
          }
          try {
            setSyncStatus("Syncing", "syncing");
            // The local cache belongs to whichever account last synced on
            // this device. If a DIFFERENT account signs in, that cache must
            // not be pushed into the new account's data — drop it and adopt
            // the new account's server list instead.
            const lastUid = localStorage.getItem(lastUidStorageKey);
            if (lastUid && lastUid !== user.uid) {
              state.sessions = [];
              saveState();
              localStorage.removeItem(pendingStorageKey);
              localStorage.removeItem(syncCursorsStorageKey);
            }
            localStorage.setItem(lastUidStorageKey, user.uid);
            await importLegacyIfNeeded();
            await syncSessions(true);
          } catch (error) {
            console.warn(error);
            setSyncStatus("Sync issue", "issue");
          }
        });
      },
      unavailable(error) {
        console.warn(error);
        authState = "unavailable";
        setSyncStatus("Offline", "issue");
      }
    };

    async function init() {
      setSyncStatus("Loading", "local");

      if ((state.activeSession && state.activeSession.pausedRemainingSeconds === null) || state.activeBreak) {
        startTick();
      }

      render();
      setInterval(() => {
        maybeShowBreakNudge();
        maybeShowIdleNudge();
      }, 30 * 1000);

      if (params.get("test_notification")) {
        requestNotificationPermission();
        setTimeout(() => {
          if (!("Notification" in window) || Notification.permission !== "granted") {
            alert("Notifications are not allowed for this site in Chrome.");
            return;
          }
          showNotification("Test", "If you can read this, banners work.");
        }, 3000);
      }

    }

    init();
  </script>
  <script type="module">
    (async () => {
      try {
        const [{ initializeApp }, auth] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js")
        ]);
        const app = initializeApp(window.PomodoroSync.firebaseConfig);
        const instance = auth.getAuth(app);
        const provider = new auth.GoogleAuthProvider();
        auth.getRedirectResult(instance).catch((error) => console.warn(error));
        window.PomodoroSync.start({
          onAuthChange(callback) {
            auth.onAuthStateChanged(instance, (user) => {
              callback(user ? { uid: user.uid, email: user.email, getToken: () => user.getIdToken() } : null);
            });
          },
          async signIn() {
            try {
              await auth.signInWithPopup(instance, provider);
            } catch (error) {
              const popupIssues = [
                "auth/popup-blocked",
                "auth/popup-closed-by-user",
                "auth/cancelled-popup-request",
                "auth/operation-not-supported-in-this-environment"
              ];
              if (popupIssues.includes(error.code)) await auth.signInWithRedirect(instance, provider);
              else throw error;
            }
          },
          signOutUser: () => auth.signOut(instance)
        });
      } catch (error) {
        window.PomodoroSync.unavailable(error);
      }
    })();
  </script>
</body>
</html>
